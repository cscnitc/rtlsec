[package]
name = "rtlsec-tool"
version = "0.2.0"
edition = "2021"
description = "Autonomous live-device security attacker + surface discovery for emulated OpenTitan"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rtlsec"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
deser-hjson = "2"
regex = "1"

[profile.release]
opt-level = 3
debug = false
